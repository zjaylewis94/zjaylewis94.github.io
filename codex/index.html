<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e1512">
<title>Codex 2.0 · Project Genesis</title>
<!--
  Codex 2.0: a worldbuilding wiki for Project Genesis.
  This file is only the shell. It holds no story content (a public copy is served at
  zjaylewis94.github.io/codex/, so keep names, places and lore out of it): the world lives in data/world.json
  in the private codex repo and loads with the user's GitHub token (or from an imported file).
  Local copy: IndexedDB "codex2_v1" (world + images), so it stays out of the shared 5 MB localStorage.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Rajdhani:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0e1512; --ink2:#131e19; --ink3:#1a2822; --line:#2b3a33;
  --brass:#c9a25e; --brass-dim:#8a7040; --paper:#e9e0c9; --smoke:rgba(233,224,201,.6);
  --lamp:#ffca7a; --glow:#5be0c8; --glow2:#7c6cff; --bad:#e0705b; --ok:#6fd08c;
  --ui:'Rajdhani',system-ui,sans-serif; --serif:'Cormorant Garamond',Georgia,serif; --mono:'DM Mono',ui-monospace,monospace;
  --hdr:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{background:var(--ink)}
body{background:transparent;color:var(--paper);font-family:var(--serif);font-size:18px;overflow:hidden}
/* glass theme: a world background (aurora by default, or an uploaded image) behind see-through panels */
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:radial-gradient(60% 50% at 18% 22%,rgba(91,224,200,.35),transparent 70%),radial-gradient(55% 45% at 82% 30%,rgba(124,108,255,.32),transparent 70%),
    radial-gradient(70% 55% at 60% 95%,rgba(255,202,122,.26),transparent 70%),radial-gradient(120% 90% at 50% -10%,#1b2a24 0%,var(--ink) 60%,#080c0a 100%)}
#bg .layer{position:absolute;inset:-30px;background-size:cover;background-position:center;opacity:0;transition:opacity .7s;filter:saturate(1.1)}
#bg .layer.on{opacity:1}
#bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,10,.42),rgba(8,12,10,.66))}
:root{--glass:rgba(14,21,18,.5);--glass2:rgba(19,30,25,.62);--blur:blur(18px) saturate(140%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--glow)}
.hidden{display:none!important}

/* header */
header{height:var(--hdr);display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);
  background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);position:relative;z-index:20}
.logo{font-family:var(--ui);font-weight:700;letter-spacing:.18em;font-size:15px;color:var(--brass);white-space:nowrap;text-decoration:none}
.logo small{color:var(--smoke);font-weight:500;letter-spacing:.08em;margin-left:6px}
nav.views{display:flex;gap:2px;margin-left:8px}
nav.views a{font-family:var(--ui);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--smoke);
  text-decoration:none;padding:6px 10px;border-radius:6px}
nav.views a.on{color:var(--ink);background:var(--brass)}
.search{flex:1;max-width:340px;margin-left:auto;position:relative}
.search input{width:100%;background:var(--ink2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-family:var(--ui);font-size:15px}
.search input:focus{outline:none;border-color:var(--brass-dim)}
.results{position:absolute;top:40px;left:0;right:0;background:rgba(19,30,25,.92);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:8px;
  max-height:60vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:30}
.results button{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.results button:hover,.results button.sel{background:var(--ink3)}
.results .snip{font-size:14px;color:var(--smoke);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.syncbtn{display:flex;align-items:center;gap:6px;font-family:var(--ui);font-size:13px;color:var(--smoke);padding:6px 8px;border-radius:6px}
.syncbtn:hover{background:var(--ink3)}
.dot{width:9px;height:9px;border-radius:50%;background:#56605b;flex:none}
.dot.ok{background:var(--ok)} .dot.dirty{background:var(--lamp)} .dot.err{background:var(--bad)} .dot.busy{background:var(--glow);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.menubtn{display:none;font-size:22px;color:var(--brass);padding:4px 6px}

/* layout */
.app{display:flex;height:calc(100% - var(--hdr))}
aside{width:290px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.side-top{padding:10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.side-top .row{display:flex;gap:6px}
select,.inp{background:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:var(--ui);font-size:14px;min-width:0}
.side-top select{flex:1}
.btn{font-family:var(--ui);font-weight:600;font-size:14px;letter-spacing:.04em;padding:7px 12px;border-radius:7px;border:1px solid var(--brass-dim);color:var(--brass)}
.btn:hover{background:rgba(201,162,94,.1)}
.btn.solid{background:var(--brass);color:var(--ink);border-color:var(--brass)}
.btn.solid:hover{background:var(--lamp)}
.btn.small{font-size:13px;padding:4px 9px}
.btn.danger{border-color:#7a3a30;color:var(--bad)}
.btn.on{background:rgba(91,224,200,.15);border-color:var(--glow);color:var(--glow)}
.list{overflow:auto;flex:1;padding:6px 0 30px}
.grp{font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--smoke);
  padding:12px 12px 4px;display:flex;align-items:center;gap:6px;width:100%;text-align:left}
.grp .n{margin-left:auto;font-weight:500}
.item{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:4px 12px;font-size:16px;line-height:1.25;color:var(--paper)}
.item:hover{background:var(--ink3)}
.item.cur{background:rgba(201,162,94,.16);box-shadow:inset 3px 0 var(--brass)}
.item .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.st-v35 .t{color:var(--smoke)}
.item.st-cut .t{text-decoration:line-through;color:#6c756f}
.pip{width:7px;height:7px;border-radius:50%;flex:none}
.tag35{font-family:var(--mono);font-size:10px;color:var(--brass-dim);margin-left:auto;flex:none}
main{flex:1;overflow:auto;position:relative;min-width:0}

/* article */
article{max-width:820px;margin:18px auto 90px;padding:28px 26px 60px;background:var(--glass2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid rgba(233,224,201,.1);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.crumbs{font-family:var(--ui);font-size:14px;color:var(--smoke);margin-bottom:6px}
.crumbs a{color:var(--smoke)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.badge{font-family:var(--ui);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:20px;border:1px solid}
h1.title{font-size:42px;font-weight:600;line-height:1.05;color:var(--paper);margin:4px 0 6px}
.aka{font-style:italic;color:var(--smoke);margin-bottom:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.review{border:1px dashed var(--brass-dim);border-radius:10px;padding:12px 14px;margin:0 0 18px;background:rgba(201,162,94,.06);
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--ui);font-size:15px}
.review span{flex:1;min-width:200px;color:var(--smoke)}
.cover{width:100%;max-height:460px;object-fit:contain;background:rgba(0,0,0,.22);border-radius:10px;border:1px solid var(--line);margin-bottom:16px;display:block}
table.fields{border-collapse:collapse;margin:0 0 18px;font-size:17px;width:100%}
table.fields td{padding:5px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.fields td:first-child{font-family:var(--ui);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);width:34%;padding-top:8px}
.body{line-height:1.55;font-size:19px}
.body p{margin:0 0 .8em}
.body h2,.body h3,.body h4{font-family:var(--ui);color:var(--brass);letter-spacing:.08em;margin:1.3em 0 .4em;font-weight:700}
.body h2{font-size:17px;text-transform:uppercase;letter-spacing:.12em}
.body h3{font-size:16px} .body h4{font-size:15px}
.body ul,.body ol{margin:0 0 .8em 1.3em}
.body li{margin:.15em 0}
.body li.chk{list-style:none;margin-left:-1.2em}
.body li.chk input{margin-right:7px;accent-color:var(--brass);transform:translateY(1px)}
.body li.chk.done{color:var(--smoke);text-decoration:line-through}
.body blockquote{border-left:3px solid var(--brass-dim);padding-left:12px;color:var(--smoke);margin:0 0 .8em;font-style:italic}
.body hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.body code{font-family:var(--mono);font-size:.8em;background:var(--ink3);padding:1px 4px;border-radius:4px}
a.wl{color:var(--glow);text-decoration:none;border-bottom:1px dotted rgba(91,224,200,.5);cursor:pointer}
a.wl:hover{border-bottom-style:solid}
a.wl.missing{color:var(--bad);border-bottom-color:rgba(224,112,91,.5)}
.empty-body{color:var(--smoke);font-style:italic}
section.sub{margin-top:30px}
.caption{font-style:italic;color:var(--smoke);font-size:16px;margin:-8px 0 16px}
.emblem{width:46px;height:46px;border-radius:10px;object-fit:contain;vertical-align:middle;margin-right:10px;background:rgba(0,0,0,.25)}
.item img.ic{width:16px;height:16px;border-radius:4px;object-fit:contain;flex:none}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:8px}
.bgs .bgc{position:relative;border:2px solid var(--line);border-radius:10px;overflow:hidden;aspect-ratio:16/10;background:var(--ink3) center/cover;cursor:pointer}
.bgs .bgc.on{border-color:var(--glow)}
.bgs .bgc span{position:absolute;left:0;right:0;bottom:0;padding:3px 7px;font-family:var(--ui);font-size:13px;background:rgba(8,12,10,.7)}
.bgs .bgc .x{position:absolute;top:4px;right:6px;color:var(--bad);font-family:var(--ui);font-size:18px;text-shadow:0 0 4px #000}
section.sub h3{font-family:var(--ui);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--smoke);margin-bottom:8px;
  display:flex;align-items:center;gap:8px}
section.sub h3 .btn{margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--ink2);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:16px;color:var(--paper);text-decoration:none}
.chip:hover{border-color:var(--brass-dim)}
.chip .lbl{font-family:var(--ui);font-size:12px;letter-spacing:.06em;color:var(--smoke);text-transform:uppercase}
.chip .x{color:var(--bad);font-family:var(--ui);margin-left:2px}
.none{color:var(--smoke);font-size:15px;font-style:italic}

/* edit */
.form{display:flex;flex-direction:column;gap:12px}
.form label{font-family:var(--ui);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);display:flex;flex-direction:column;gap:4px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .inp,.form select{font-size:16px;padding:8px 10px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--paper)}
.form .ttl{font-family:var(--serif);font-size:30px;font-weight:600}
textarea.inp{font-family:var(--serif);font-size:18px;line-height:1.5;min-height:340px;resize:vertical}
.frow{display:flex;gap:6px;margin-bottom:6px}
.frow .inp:first-child{width:36%}
.frow .inp:nth-child(2){flex:1}
.check{flex-direction:row!important;align-items:center;gap:8px!important;text-transform:none!important;letter-spacing:0!important;font-size:15px!important;color:var(--paper)!important}
.hint{font-family:var(--ui);font-size:13px;color:var(--smoke);text-transform:none;letter-spacing:0;font-weight:500}
.bodywrap{position:relative}
.ac{position:absolute;left:8px;right:8px;top:100%;background:var(--ink2);border:1px solid var(--brass-dim);border-radius:8px;z-index:5;max-height:240px;overflow:auto}
.ac button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;padding:7px 10px;font-size:16px}
.ac button:hover,.ac button:first-child{background:var(--ink3)}
.formbar{display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;padding:12px 0;background:linear-gradient(transparent,var(--ink) 30%)}

/* home */
.home h1{font-size:46px;font-weight:600;color:var(--paper);line-height:1.05}
.home .lede{color:var(--smoke);font-size:20px;margin:8px 0 22px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:26px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:rgba(14,21,18,.45);text-align:left}
.stat:hover{border-color:var(--brass-dim)}
.stat b{display:block;font-family:var(--ui);font-size:26px;color:var(--paper)}
.stat span{font-family:var(--ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.progress{height:8px;background:var(--ink3);border-radius:8px;overflow:hidden;margin:8px 0 4px;display:flex}
.progress i{display:block;height:100%}

/* graph + map */
.stage{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.toolbar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:5;pointer-events:none}
.toolbar>*{pointer-events:auto}
.toolbar .btn,.toolbar select{background:rgba(14,21,18,.9)}
.toolbar .btn.solid{background:var(--brass)}
svg.graph{width:100%;height:100%;display:block;cursor:grab}
svg.graph .gn{cursor:pointer}
svg.graph .gn text{font-family:var(--ui);font-size:12px;fill:var(--paper);paint-order:stroke;stroke:var(--ink);stroke-width:3px;pointer-events:none}
svg.graph.far .gn:not(.big):not(.sel) text{display:none}
svg.graph .gn.dim{opacity:.18}
svg.graph line{stroke:#4b5b53;stroke-width:1.2}
svg.graph line.rel{stroke:var(--brass-dim);stroke-width:1.8}
svg.graph line.men{stroke-dasharray:3 4;opacity:.55}
svg.graph line.dim{opacity:.07}
svg.graph line.hi{stroke:var(--glow);opacity:1}
svg.graph text.el{font-family:var(--ui);font-size:10px;fill:var(--brass);paint-order:stroke;stroke:var(--ink);stroke-width:3px}
.info{position:absolute;left:10px;right:10px;bottom:10px;max-width:460px;background:rgba(19,30,25,.78);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--brass-dim);
  border-radius:12px;padding:12px 14px;z-index:6;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.info h4{font-size:24px;font-weight:600;line-height:1.1;margin:4px 0}
.info p{font-size:16px;color:var(--smoke);margin:4px 0 10px;max-height:5.4em;overflow:hidden}
.info .row{display:flex;gap:6px;flex-wrap:wrap}
.legend{position:absolute;right:10px;bottom:10px;font-family:var(--ui);font-size:12px;color:var(--smoke);background:rgba(14,21,18,.85);
  border:1px solid var(--line);border-radius:8px;padding:6px 9px;z-index:4;display:flex;flex-direction:column;gap:2px}
.legend span{display:flex;gap:6px;align-items:center}
.mapstage{position:absolute;left:0;top:0;transform-origin:0 0}
.mapstage img{display:block;pointer-events:none;-webkit-user-drag:none}
.pin{position:absolute;width:0;height:0}
.pin button{position:absolute;left:-13px;top:-30px;width:26px;height:30px;transform-origin:13px 30px}
.pin svg{width:26px;height:30px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7))}
.pin .pl{position:absolute;left:14px;top:-26px;white-space:nowrap;font-family:var(--ui);font-weight:600;font-size:13px;
  background:rgba(14,21,18,.85);padding:1px 6px;border-radius:5px;transform-origin:-14px 26px;pointer-events:none}
#mauto,#mpaint,#mcaps,#mshade,#mdeco,#mvec{position:absolute;left:0;top:0}
#mauto,#mcaps,#mshade,#mdeco{pointer-events:none}
.v3d{position:absolute;inset:0;z-index:7;background:var(--ink)}
#c3d{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.mapstage img{position:absolute;left:0;top:0}
#mvec{overflow:visible}
#mvec text{font-family:var(--ui);font-weight:700;paint-order:stroke;stroke:#0e1512;stroke-linejoin:round}
#mvec .zl{fill:var(--paper);pointer-events:none;letter-spacing:.08em}
#mvec .lb{cursor:default}
#mvec .lb.on{text-decoration:underline}
#mvec .h{fill:#0e1512;stroke:var(--glow);cursor:move}
#mvec .h.on{fill:var(--glow)}
#mvec .h.draft{fill:var(--lamp);stroke:#0e1512;pointer-events:none}
#mvec .h.first{fill:var(--glow)}
.stage.editing.tool-paint,.stage.editing.tool-zone,.stage.editing.tool-path,.stage.editing.tool-label,.stage.editing.tool-pin{cursor:crosshair}
.toolbar{flex-direction:column;align-items:flex-start}
.tools-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none}
.tools-row>*{pointer-events:auto}
.tools-row:empty{display:none}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none}
.sw.on{border-color:var(--paper);box-shadow:0 0 0 2px var(--ink)}
.pill{background:rgba(14,21,18,.85);padding:3px 8px;border-radius:6px}
.btn[disabled]{opacity:.4;cursor:default}
.pin.on svg{filter:drop-shadow(0 0 6px var(--glow))}
.info .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.centered{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.centered .box{max-width:460px}
.centered h2{font-size:32px;font-weight:600;margin-bottom:8px}
.centered p{color:var(--smoke);margin-bottom:16px}

/* timeline */
.tl{position:relative;margin:20px 0 0 8px;padding-left:26px;border-left:2px solid var(--brass-dim)}
.ev{position:relative;margin-bottom:22px}
.ev:before{content:"";position:absolute;left:-34px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--ink);border:2px solid var(--lamp)}
.ev .when{font-family:var(--ui);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--lamp)}
.ev a{font-size:24px;font-weight:600;color:var(--paper);text-decoration:none;display:block;line-height:1.15}
.ev p{color:var(--smoke);font-size:16px;margin-top:2px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(5,8,7,.7);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:8vh 14px 14px}
.modal .box{width:100%;max-width:520px;background:rgba(19,30,25,.82);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--brass-dim);border-radius:14px;padding:18px;max-height:84vh;overflow:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h2{font-size:28px;font-weight:600;margin-bottom:10px}
.modal p{color:var(--smoke);font-size:16px;margin-bottom:10px}
.modal .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pick{max-height:46vh;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:8px}
.pick button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:17px}
.pick button:hover{background:var(--ink3)}
.typegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.typegrid button{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;display:flex;gap:8px;align-items:center;font-family:var(--ui);font-weight:600;font-size:16px}
.typegrid button:hover{border-color:var(--brass-dim);background:var(--ink3)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink3);border:1px solid var(--brass-dim);padding:9px 16px;border-radius:9px;
  font-family:var(--ui);font-size:15px;z-index:60;max-width:90vw}
.mob-scrim{display:none}

@media (max-width:820px){
  :root{--hdr:52px}
  .menubtn{display:block}
  /* a backdrop-filter on the header would trap the fixed bottom tab bar inside it */

    justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:25}

<body>
<div id="bg"><div class="layer"></div><div class="layer"></div></div>

          <option value="live">Not cut</option><option value="all">Everything</option><option value="draft">Draft</option>

</div>
<input type="file" id="fileIn" class="hidden">

<script>
'use strict';
/* ---------- config ---------- */
const DB_NAME = 'codex2_v1', GH_KEY = 'codex2_gh', UI_KEY = 'codex2_ui';
const WORLD_PATH = 'data/world.json', MEDIA_DIR = 'data/media/';
const DEFAULT_GH = { owner: 'zjaylewis94', repo: 'codex', branch: 'main', token: '' };
const TYPES = {
  character: { label: 'Character', plural: 'Characters', color: '#ffca7a', icon: '◉', fields: ['Role', 'Faction', 'First appears'] },
  location:  { label: 'Location',  plural: 'Locations',  color: '#5be0c8', icon: '⌖', fields: ['Region'] },
  faction:   { label: 'Faction',   plural: 'Factions',   color: '#e0705b', icon: '⚑', fields: ['Leader', 'Goal'] },
  item:      { label: 'Item',      plural: 'Items',      color: '#c9a25e', icon: '◆', fields: ['Used for'] },
  lore:      { label: 'Lore',      plural: 'Lore',       color: '#a99bff', icon: '✦', fields: [] },
  event:     { label: 'Event',     plural: 'Events',     color: '#f2e394', icon: '◷', fields: ['When', 'Order'] },
  puzzle:    { label: 'Puzzle',    plural: 'Puzzles',    color: '#6fd08c', icon: '⧉', fields: ['Where', 'Needs', 'Solution', 'Reveals'] },
  gameplay:  { label: 'Gameplay',  plural: 'Gameplay',   color: '#8fb4ff', icon: '⚙', fields: [] },
  story:     { label: 'Story',     plural: 'Story',      color: '#e9a3c9', icon: '❦', fields: [] },
  note:      { label: 'Note',      plural: 'Notes',      color: '#9aa59f', icon: '✎', fields: [] },
};
const STATUSES = {
  draft: { label: 'Draft', color: '#c9a25e' }, canon: { label: 'Canon', color: '#6fd08c' },
  v35: { label: 'v35 · review', color: '#8a7040' }, cut: { label: 'Cut', color: '#6c756f' },
};
const REL_LABELS = ['member of', 'leads', 'runs', 'sibling of', 'brother of', 'sister of', 'parent of', 'partner of', 'rival of', 'ally of',
  'located in', 'owns', 'made by', 'unlocks', 'solved with', 'reveals', 'happened to', 'appears in', 'drives'];

/* ---------- state ---------- */
let W = null;                  // the world
let meta = { baseSha: null, dirty: false, syncedMedia: [], mediaGone: [], lastSync: 0 };
let gh = loadJSON(GH_KEY, DEFAULT_GH);
let ui = loadJSON(UI_KEY, { fType: 'all', fStatus: 'live', showMentions: true, showV35: true, mapId: null });
const media = {};              // id -> dataURL (in-memory cache of IndexedDB "media")
let cache = {};                // derived indexes; cleared on every change
let editing = null;            // { id, dirty } while a card form is open
let syncState = 'local', syncMsg = '';

const $ = s => document.querySelector(s);
const main = $('#main');
function loadJSON(k, d) { try { return Object.assign({}, d, JSON.parse(localStorage.getItem(k) || '{}')); } catch (e) { return Object.assign({}, d); } }
function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const uid = p => (p || 'c') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const typeOf = c => TYPES[c.type] || TYPES.note;
function toast(msg, ms) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), ms || 2600);
}

/* ---------- IndexedDB ---------- */
let dbp = null;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('media'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function idb(store, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction(store, mode); const req = fn(tx.objectStore(store));
    tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error);
  });
}
const idbGet = (s, k) => idb(s, 'readonly', st => st.get(k));
const idbPut = (s, k, v) => idb(s, 'readwrite', st => st.put(v, k));
const idbDel = (s, k) => idb(s, 'readwrite', st => st.delete(k));
const idbKeys = s => idb(s, 'readonly', st => st.getAllKeys());

/* ---------- world ---------- */
function blankWorld() { return { format: 'codex2', version: 1, updated: Date.now(), cards: [], relations: [], maps: [], canvas: {}, deleted: {}, backgrounds: [], theme: {} }; }
function normalize(w) {
  w = Object.assign(blankWorld(), w || {});
  w.cards = (w.cards || []).map(c => Object.assign({ aliases: [], tags: [], fields: [], status: 'draft', parent: null, body: '', autolink: true, type: 'note', order: 0 }, c));
  w.maps.forEach(normalizeMap);
  return w;
}
const card = id => (cache.byId || buildById())[id];
function buildById() { cache.byId = {}; W.cards.forEach(c => { cache.byId[c.id] = c; }); return cache.byId; }
let saveTimer = null, pushTimer = null;
function changed(opts) {
  cache = {};
  W.updated = Date.now();
  meta.dirty = true;
  clearTimeout(saveTimer); saveTimer = setTimeout(saveLocal, 250);
  if (gh.token && !(opts && opts.noPush)) { clearTimeout(pushTimer); pushTimer = setTimeout(() => sync(), 4000); }
  setSync(gh.token ? 'dirty' : 'local');
}
async function saveLocal() {
  try { await idbPut('kv', 'world', W); await idbPut('kv', 'meta', meta); }
  catch (e) { try { localStorage.setItem('codex2_world_fallback', JSON.stringify(W)); } catch (e2) { toast('Could not save locally: ' + e.message, 5000); } }
}
function touch(c) { c.updated = Date.now(); }
function getField(c, k) { const f = c.fields.find(f => f.k.toLowerCase() === k.toLowerCase()); return f ? f.v : ''; }

/* ---------- linking ---------- */
function nameIndex() {
  if (cache.names) return cache.names;
  const exact = {}, auto = [];
  for (const c of W.cards) {
    for (const n of [c.title, ...c.aliases]) {
      if (!n) continue;
      if (!exact[n.toLowerCase()]) exact[n.toLowerCase()] = c.id;
      if (c.autolink && c.status !== 'cut' && n.length >= 3) auto.push([n, c.id]);
    }
  }
  auto.sort((a, b) => b[0].length - a[0].length);
  const map = {}; auto.forEach(([n, id]) => { if (!map[n]) map[n] = id; });
  const re = auto.length ? new RegExp('(^|[^A-Za-z0-9_])(' + Object.keys(map).map(escRe).join('|') + ')(?![A-Za-z0-9_])', 'g') : null;
  return (cache.names = { exact, map, re });
}
const resolve = name => nameIndex().exact[name.trim().toLowerCase()] || null;
// Ids each card points at: explicit [[links]] plus auto-linked names.
function mentionsOf(c) {
  cache.mentions = cache.mentions || {};
  if (cache.mentions[c.id]) return cache.mentions[c.id];
  const out = new Set(), { re, map } = nameIndex();
  c.body.replace(/\[\[([^\]|]+)(\|[^\]]*)?\]\]/g, (m, n) => { const id = resolve(n); if (id) out.add(id); return m; });
  if (re) { re.lastIndex = 0; let m; const plain = c.body.replace(/\[\[[^\]]*\]\]/g, ' '); while ((m = re.exec(plain))) out.add(map[m[2]]); }
  out.delete(c.id);
  return (cache.mentions[c.id] = out);
}
function backlinks(id) { return W.cards.filter(c => c.id !== id && mentionsOf(c).has(id)); }
function relationsOf(id) { return W.relations.filter(r => r.a === id || r.b === id); }

/* ---------- markdown-lite ---------- */
function inline(text, ctx) {
  const parts = text.split(/(\[\[[^\]]+\]\])/);
  let html = '';
  for (const p of parts) {
    const m = p.match(/^\[\[([^\]|]+)(?:\|([^\]]*))?\]\]$/);
    if (m) {
      const id = resolve(m[1]);
      const label = esc(m[2] || m[1]);
      html += id ? `<a class="wl" data-id="${esc(id)}">${label}</a>` : `<a class="wl missing" data-new="${esc(m[1].trim())}" title="Not written yet — tap to create">${label}</a>`;
      continue;
    }
    html += autolink(p, ctx);
  }
  return html.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/`([^`\n]+)`/g, '<code>$1</code>');
}
function autolink(text, ctx) {
  const { re, map } = nameIndex();
  if (!re || !ctx) return esc(text);
  let out = '', last = 0, m; re.lastIndex = 0;
  while ((m = re.exec(text))) {
    const name = m[2], id = map[name], start = m.index + m[1].length;
    if (id === ctx.self || ctx.seen.has(id)) continue;   // link each card once per page
    ctx.seen.add(id);
    out += esc(text.slice(last, start)) + `<a class="wl" data-id="${esc(id)}">${esc(name)}</a>`;
    last = start + name.length;
  }
  return out + esc(text.slice(last));
}
function renderBody(src, self) {
  const ctx = { self, seen: new Set() };
  const lines = src.split('\n');
  let html = '', para = [], list = null;
  const flushP = () => { if (para.length) { html += '<p>' + para.join('<br>') + '</p>'; para = []; } };
  const flushL = () => { if (list) { html += `</${list}>`; list = null; } };
  lines.forEach((raw, i) => {
    const l = raw.trimEnd();
    let m;
    if (!l.trim()) { flushP(); flushL(); return; }
    if ((m = l.match(/^(#{1,3})\s+(.*)$/))) { flushP(); flushL(); const n = m[1].length + 1; html += `<h${n}>${inline(m[2], ctx)}</h${n}>`; return; }
    if (/^\s*(---+|═{3,}|─{3,})\s*$/.test(l)) { flushP(); flushL(); html += '<hr>'; return; }
    if ((m = l.match(/^\s*[-*]\s+\[( |x|X)\]\s*(.*)$/))) {
      flushP(); if (list !== 'ul') { flushL(); html += '<ul>'; list = 'ul'; }
      const done = m[1] !== ' ';
      html += `<li class="chk${done ? ' done' : ''}"><input type="checkbox" data-line="${i}"${done ? ' checked' : ''}>${inline(m[2], ctx)}</li>`; return;
    }
    if ((m = l.match(/^\s*[-*•]\s+(.*)$/))) { flushP(); if (list !== 'ul') { flushL(); html += '<ul>'; list = 'ul'; } html += `<li>${inline(m[1], ctx)}</li>`; return; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))) { flushP(); if (list !== 'ol') { flushL(); html += '<ol>'; list = 'ol'; } html += `<li>${inline(m[1], ctx)}</li>`; return; }
    if ((m = l.match(/^>\s?(.*)$/))) { flushP(); flushL(); html += `<blockquote>${inline(m[1], ctx)}</blockquote>`; return; }
    flushL(); para.push(inline(l, ctx));
  });
  flushP(); flushL();
  return html;
}
function excerpt(c, n) {
  const t = c.body.replace(/\[\[([^\]|]+)(\|([^\]]*))?\]\]/g, (m, a, b, lbl) => lbl || a).replace(/^#+\s*/gm, '').replace(/[*`>]/g, '')
    .replace(/^\s*-\s*\[.\]\s*/gm, '').replace(/^\s*-\s+/gm, '').replace(/\s+/g, ' ').trim();
  return t.length > (n || 160) ? t.slice(0, n || 160).replace(/\s\S*$/, '') + '…' : t;
}

/* ---------- filters + sidebar ---------- */
function passes(c, f) {
  f = f || ui;
  if (f.fType !== 'all' && c.type !== f.fType) return false;
  if (f.fStatus === 'live') return c.status !== 'cut';
  if (f.fStatus === 'all') return true;
  return c.status === f.fStatus;
}
function initFilters() {
  $('#fType').innerHTML = '<option value="all">All types</option>' + Object.entries(TYPES).map(([k, t]) => `<option value="${k}">${t.plural}</option>`).join('');
  $('#fType').value = ui.fType; $('#fStatus').value = ui.fStatus;
  $('#fType').onchange = e => { ui.fType = e.target.value; saveJSON(UI_KEY, ui); renderList(); if (view() === 'graph') render(); };
  $('#fStatus').onchange = e => { ui.fStatus = e.target.value; saveJSON(UI_KEY, ui); renderList(); if (view() === 'graph') render(); };
}
function renderList() {
  if (!W) { $('#list').innerHTML = ''; return; }
  const cur = route().id;
  const shown = W.cards.filter(c => passes(c));
  const ids = new Set(shown.map(c => c.id));
  let html = '';
  for (const [k, t] of Object.entries(TYPES)) {
    const inType = shown.filter(c => c.type === k);
    if (!inType.length) continue;
    html += `<div class="grp"><span class="pip" style="background:${t.color}"></span>${t.plural}<span class="n">${inType.length}</span></div>`;
    const kids = {};
    inType.forEach(c => { const p = c.parent && ids.has(c.parent) ? c.parent : ''; (kids[p] = kids[p] || []).push(c); });
    const sortC = a => a.sort((x, y) => (x.order - y.order) || x.title.localeCompare(y.title));
    const walk = (p, depth) => sortC(kids[p] || []).forEach(c => {
      html += `<button class="item st-${c.status}${c.id === cur ? ' cur' : ''}" data-open="${esc(c.id)}" style="padding-left:${12 + depth * 14}px">` +
        (c.icon ? `<img class="ic" data-media="${esc(c.icon)}" alt="">` : `<span class="pip" style="background:${typeOf(c).color};opacity:${c.status === 'v35' ? .45 : 1}"></span>`) + `<span class="t">${esc(c.title)}</span>` +
        (c.status === 'v35' ? '<span class="tag35">v35</span>' : '') + '</button>';
      walk(c.id, depth + 1);
    });
    walk('', 0);
  }
  $('#list').innerHTML = html || '<div class="none" style="padding:14px">Nothing matches these filters.</div>';
  hydrateMedia($('#list'));
}

/* ---------- routing ---------- */
function route() {
  const h = location.hash.replace(/^#\/?/, '').split('/');
  return { v: h[0] || 'wiki', id: h[1] ? decodeURIComponent(h[1]) : null };
}
const view = () => { const v = route().v; return v === 'card' ? 'wiki' : v; };
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }
const openCard = id => go('#/card/' + encodeURIComponent(id));
let lastHash = location.hash;
window.addEventListener('hashchange', () => {
  if (editing && editing.dirty && !confirm('Leave without saving your changes?')) { history.replaceState(null, '', lastHash || '#/'); return; }
  if (editing && editing.id !== route().id) editing = null;
  lastHash = location.hash; document.body.classList.remove('side-open'); render();
});

function render() {
  lastHash = location.hash;
  const r = route();
  close3D();
  if (mapEditing() && (r.v !== 'map' || (r.id && r.id !== M.map.id))) exitEdit(true);
  document.querySelectorAll('#views a').forEach(a => a.classList.toggle('on', a.dataset.v === view()));
  renderList(); applyBg();
  if (!W) return renderWelcome();
  if (r.v === 'card' && r.id && card(r.id)) return editing && editing.id === r.id ? renderEdit(card(r.id)) : renderCard(card(r.id));
  if (r.v === 'graph') return renderGraph();
  if (r.v === 'map') return renderMap(r.id);
  if (r.v === 'timeline') return renderTimeline();
  renderHome();
}

/* ---------- welcome + home ---------- */
function renderWelcome() {
  main.innerHTML = `<div class="centered"><div class="box">
    <h2>Codex 2.0</h2>
    <p>The Project Genesis world lives in the private <b>codex</b> repo. Connect with your GitHub token to load it, or open a Codex file you exported.</p>
    <div class="row" style="justify-content:center;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn solid" data-act="settings">Connect GitHub</button>
      <button class="btn" data-act="import">Open a file</button>
      <button class="btn" data-act="start-empty">Start empty</button>
    </div></div></div>`;
}
function renderHome() {
  const live = W.cards.filter(c => c.status !== 'cut');
  const n = s => W.cards.filter(c => c.status === s).length;
  const total = W.cards.length || 1;
  const recent = W.cards.filter(c => c.status !== 'v35' || c.updated !== c.created).sort((a, b) => b.updated - a.updated).slice(0, 8);
  main.innerHTML = `<article class="home">
    <h1>Project Genesis</h1>
    <p class="lede">${live.length} cards · ${W.relations.length} connections · ${W.maps.length} map${W.maps.length === 1 ? '' : 's'}</p>
    <div class="stats">${Object.entries(TYPES).map(([k, t]) => {
      const c = live.filter(x => x.type === k).length;
      return `<button class="stat" data-ftype="${k}"><b>${c}</b><span style="color:${t.color}">${t.icon} ${t.plural}</span></button>`;
    }).join('')}</div>
    <section class="sub"><h3>Reviewing v35</h3>
      <div class="progress">${['canon', 'draft', 'cut', 'v35'].map(s => `<i style="width:${n(s) / total * 100}%;background:${STATUSES[s].color}"></i>`).join('')}</div>
      <p class="hint">${n('canon')} canon · ${n('draft')} draft · ${n('cut')} cut · <b>${n('v35')}</b> still to review</p>
      ${n('v35') ? '<div class="tools"><button class="btn" data-act="review-next">Review the next v35 card</button></div>' : ''}
    </section>
    <section class="sub"><h3>Recently changed</h3><div class="chips">${recent.map(c => chip(c)).join('') || '<span class="none">Nothing yet.</span>'}</div></section>
  </article>`;
}
function chip(c, extra) {
  return `<a class="chip" data-id="${esc(c.id)}"><span class="pip" style="background:${typeOf(c).color}"></span>${extra || ''}${esc(c.title)}</a>`;
}

/* ---------- card page ---------- */
function renderCard(c) {
  const t = typeOf(c), st = STATUSES[c.status] || STATUSES.draft;
  const crumbs = []; for (let p = card(c.parent); p && crumbs.length < 6; p = card(p.parent)) crumbs.unshift(p);
  const kids = W.cards.filter(x => x.parent === c.id).sort((a, b) => (a.order - b.order) || a.title.localeCompare(b.title));
  const rels = relationsOf(c.id);
  const back = backlinks(c.id);
  const pins = W.maps.filter(m => m.pins.some(p => p.card === c.id) || m.zones.some(z => z.card === c.id));
  const fields = c.fields.filter(f => f.k.trim() || f.v.trim());
  main.innerHTML = `<article>
    ${crumbs.length ? `<div class="crumbs">${crumbs.map(p => `<a class="wl" data-id="${esc(p.id)}">${esc(p.title)}</a>`).join(' › ')} ›</div>` : ''}
    <div class="badges"><span class="badge" style="color:${t.color};border-color:${t.color}">${t.icon} ${t.label}</span>
      <span class="badge" style="color:${st.color};border-color:${st.color}">${st.label}</span>
      ${c.tags.map(g => `<span class="badge" style="color:var(--smoke);border-color:var(--line)">#${esc(g)}</span>`).join('')}</div>
    <h1 class="title">${c.icon ? `<img class="emblem" data-media="${esc(c.icon)}" alt="">` : ''}${esc(c.title)}</h1>
    ${c.aliases.length ? `<div class="aka">also: ${c.aliases.map(esc).join(', ')}</div>` : ''}
    ${c.status === 'v35' ? `<div class="review"><span>From the original Codex. Does it still fit 2.0?</span>
      <button class="btn small" data-status="draft">Keep as draft</button><button class="btn small" data-status="canon">Canon</button>
      <button class="btn small danger" data-status="cut">Cut</button><button class="btn small" data-act="review-next">Skip ›</button></div>` : ''}
    <div class="tools"><button class="btn" data-act="edit">Edit</button>
      ${c.status !== 'v35' ? `<select data-act="set-status" class="inp">${Object.entries(STATUSES).map(([k, s]) => `<option value="${k}"${k === c.status ? ' selected' : ''}>${s.label}</option>`).join('')}</select>` : ''}

        <circle r="${r.toFixed(1)}" fill="${typeOf(c).color}" fill-opacity="${c.status === 'v35' ? .5 : .95}" stroke="#0e1512" stroke-width="2"/>
        <text y="${(r + 13).toFixed(0)}" text-anchor="middle">${esc(c.title.length > 26 ? c.title.slice(0, 24) + '…' : c.title)}</text></g>`; }).join('')}</g>
    </g></svg>

      <span style="margin-top:4px">— connection · - - mention</span></div>

function layoutGraph(nodes, edges, force) {
  const pos = W.canvas, missing = nodes.filter(c => force || !pos[c.id]);
  if (!missing.length) return;
  const typeKeys = Object.keys(TYPES);
  const hash = s => { let h = 7; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) | 0; return h; };
  const P = {};

    if (!force && pos[c.id]) { P[c.id] = { x: pos[c.id].x, y: pos[c.id].y, fixed: true }; return; }
    const a = typeKeys.indexOf(c.type) / typeKeys.length * Math.PI * 2, h = hash(c.id);

  E.forEach(([p, q]) => { p.links = (p.links || 0) + 1; q.links = (q.links || 0) + 1; });
  for (let it = 0; it < 260; it++) {
    const temp = 18 * (1 - it / 260) + 1;
    list.forEach(p => { p.dx = 0; p.dy = 0; });
    for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {

    E.forEach(([p, q, k]) => { const dx = q.x - p.x, dy = q.y - p.y; p.dx += dx * k; p.dy += dy * k; q.dx -= dx * k; q.dy -= dy * k; });
    list.forEach(p => {
      if (p.fixed) return;
      const g = p.links ? .006 : .03;   // pull loose cards in harder so they don't drift off the screen
      p.dx -= p.x * g; p.dy -= p.y * g;
      const l = Math.hypot(p.dx, p.dy) || 1, s = Math.min(l, temp) / l; p.x += p.dx * s; p.y += p.dy * s;
    });
  }
  Object.entries(P).forEach(([id, p]) => { pos[id] = { x: Math.round(p.x), y: Math.round(p.y) }; });
  saveLocal();
}

  G.svg.querySelectorAll('line').forEach(l => {
    const e = G.edges[l.dataset.e], a = pos[e.a], b = pos[e.b];
    l.setAttribute('x1', a.x); l.setAttribute('y1', a.y); l.setAttribute('x2', b.x); l.setAttribute('y2', b.y);
  });

    const e = G.edges[t.dataset.el], a = pos[e.a], b = pos[e.b];
    t.setAttribute('x', (a.x + b.x) / 2); t.setAttribute('y', (a.y + b.y) / 2 - 3);

}
function applyView() {

  G.svg.classList.toggle('far', v.k < .75);

function fitGraph() {

  // Fit the middle 94% of cards so a few loose ones don't shrink everything.
  const r = G.svg.getBoundingClientRect(), q = (a, f) => a[Math.min(a.length - 1, Math.floor(a.length * f))];

/* zones + paths */
function project(q, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy || 1;
  const t = Math.max(0, Math.min(1, ((q.x - a.x) * dx + (q.y - a.y) * dy) / l2));
  const x = a.x + t * dx, y = a.y + t * dy;
  return { x, y, t, d: Math.hypot(q.x - x, q.y - y) };
}
// Nearest existing corner, else nearest zone edge, within a finger's reach.
function snapTarget(q) {
  const m = M.map, r = 16 / M.view.k;
  let best = null, bd = r;
  for (const [id, p] of Object.entries(m.points)) { const d = Math.hypot(p.x - q.x, p.y - q.y); if (d < bd) { bd = d; best = { pt: id, x: p.x, y: p.y }; } }
  if (best) return best;
  for (const z of m.zones) for (let i = 0; i < z.pts.length; i++) {
    const a = z.pts[i], b = z.pts[(i + 1) % z.pts.length], pa = m.points[a], pb = m.points[b];
    if (!pa || !pb) continue;
    const pr = project(q, pa, pb);
    if (pr.d < bd && pr.t > .02 && pr.t < .98) { bd = pr.d; best = { edge: [a, b], x: pr.x, y: pr.y }; }
  }
  return best;
}
function insertOnEdge(a, b, id) {
  for (const z of M.map.zones) for (let i = 0; i < z.pts.length; i++) {
    const p = z.pts[i], n = z.pts[(i + 1) % z.pts.length];
    if ((p === a && n === b) || (p === b && n === a)) { z.pts.splice(i + 1, 0, id); break; }
  }
}
function addZonePoint(q) {
  const d = M.draft || (M.draft = { kind: 'zone', pts: [] });
  const snap = snapTarget(q), r = 16 / M.view.k;
  if (d.pts.length >= 3) {
    const f = d.pts[0];
    if ((snap && snap.pt && snap.pt === f.pt) || Math.hypot(q.x - f.x, q.y - f.y) < r) return finishDraft();
  }
  const pt = snap ? { ...snap } : { x: Math.round(q.x), y: Math.round(q.y) };
  const last = d.pts[d.pts.length - 1];
  if (last && ((pt.pt && pt.pt === last.pt) || Math.hypot(pt.x - last.x, pt.y - last.y) < r / 2)) return;
  d.pts.push(pt); redraw();
}
function addPathPoint(q) {
  const d = M.draft || (M.draft = { kind: 'path', pts: [] });
  const snap = snapTarget(q), r = 16 / M.view.k;
  const pt = snap ? { x: snap.x, y: snap.y } : { x: Math.round(q.x), y: Math.round(q.y) };
  const last = d.pts[d.pts.length - 1];
  if (last && Math.hypot(pt.x - last.x, pt.y - last.y) < r) { if (d.pts.length >= 2) finishDraft(); return; }
  d.pts.push(pt); redraw();
}
function finishDraft() {
  const d = M.draft, m = M.map; if (!d) return;
  M.draft = null; M.hover = null;
  if (d.kind === 'zone') {
    if (d.pts.length < 3) { toast('A zone needs at least 3 corners'); return redraw(); }
    snapUndo();
    const ids = d.pts.map(p => {
      if (p.pt) return p.pt;
      const id = uid('v'); m.points[id] = { x: Math.round(p.x), y: Math.round(p.y) };
      if (p.edge) insertOnEdge(p.edge[0], p.edge[1], id);
      return id;
    });
    const z = { id: uid('z'), name: '', color: M.edit.zoneColor, card: null, pts: ids };
    m.zones.push(z); touchMap();
    M.edit.tool = 'select'; select({ t: 'zone', id: z.id });
  } else {
    if (d.pts.length < 2) { toast('A path needs at least 2 points'); return redraw(); }
    snapUndo();
    const p = { id: uid('l'), name: '', style: M.edit.pathStyle, pts: d.pts.map(q => [Math.round(q.x), Math.round(q.y)]) };
    m.paths.push(p); touchMap();
    M.edit.tool = 'select'; select({ t: 'path', id: p.id });
  }
}
function addLabel(q) {
  const text = prompt('Label text'); if (!text || !text.trim()) return;
  snapUndo();
  const l = { id: uid('t'), x: Math.round(q.x), y: Math.round(q.y), text: text.trim(), size: Math.round(34 * mapScale(M.map)), color: '#e9e0c9' };
  M.map.labels.push(l); touchMap(); select({ t: 'label', id: l.id });
}
function addPin(q) {
  const m = M.map, x = q.x / m.w, y = q.y / m.h;
  if (x < 0 || y < 0 || x > 1 || y > 1) return;
  pickCard({ title: 'What goes here?', onPick: id => { snapUndo(); m.pins.push({ id: uid('p'), x: +x.toFixed(4), y: +y.toFixed(4), card: id }); touchMap(); drawPins(); } });
}

/* selection + info panel */
function hideInfo() { const i = $('#minfo'); if (i) i.classList.add('hidden'); }
function select(s) { M.sel = s; redraw(); s ? showProps() : hideInfo(); }
function selected() {
  const m = M.map, s = M.sel; if (!s) return null;
  return { zone: () => m.zones.find(z => z.id === s.id), path: () => m.paths.find(p => p.id === s.id), label: () => m.labels.find(l => l.id === s.id),
    pin: () => m.pins.find(p => p.id === s.id), pt: () => m.points[s.id] }[s.t]();
}
function cardChip(id) { const c = card(id); return c ? `<button class="btn small" data-id="${esc(c.id)}">Open ${esc(c.title)}</button>` : ''; }
function showProps() {

    <div class="row" style="margin-top:8px">${it.card ? cardChip(it.card) + '<button class="btn small" data-act="m-unlink">Unlink</button>' : '<button class="btn small" data-act="m-link">Link a card</button>'}
      <button class="btn small danger" data-act="m-del">Delete zone</button></div>`;
  if (s.t === 'path') h = `<span class="hint">${(PATH_STYLES[it.style] || PATH_STYLES.road).label}</span><input class="inp" data-mprop="name" value="${esc(it.name)}" placeholder="Name (optional)" style="width:100%;margin:6px 0">
    <div class="row">${Object.entries(PATH_STYLES).map(([k, st]) => `<button class="btn small${it.style === k ? ' on' : ''}" data-act="m-pstyle" data-v="${k}">${st.label}</button>`).join('')}
      <button class="btn small danger" data-act="m-del">Delete</button></div>`;
  if (s.t === 'label') h = `<span class="hint">Label</span><input class="inp" data-mprop="text" value="${esc(it.text)}" style="width:100%;margin:6px 0">
    <div class="row">${[['S', 22], ['M', 34], ['L', 56], ['XL', 90]].map(([k, n]) => `<button class="btn small${Math.round(n * mapScale(M.map)) === it.size ? ' on' : ''}" data-act="m-lsize" data-v="${n}">${k}</button>`).join('')}
      ${['#e9e0c9', '#0e1512', '#ffca7a', '#5be0c8'].map(c => `<button class="sw${it.color === c ? ' on' : ''}" data-act="m-lcolor" data-v="${c}" style="background:${c}"></button>`).join('')}
      <button class="btn small${it.elev ? ' on' : ''}" data-act="m-lelev">Show height</button>
      <button class="btn small danger" data-act="m-del">Delete</button></div>`;
  if (s.t === 'pin') h = `<span class="hint">Pin</span><div class="row" style="margin-top:6px">${cardChip(it.card)}<button class="btn small danger" data-act="m-del">Remove pin</button></div>`;
  if (s.t === 'pt') h = `<span class="hint">Corner · shared by ${M.map.zones.filter(z => z.pts.includes(s.id)).length} zone(s)</span><div class="row" style="margin-top:6px"><button class="btn small danger" data-act="m-del">Delete corner</button></div>`;
  info.innerHTML = h; info.classList.remove('hidden');
  info.querySelectorAll('[data-mprop]').forEach(inp => {
    inp.oninput = () => { it[inp.dataset.mprop] = inp.value; drawVec(); clearTimeout(inp._t); inp._t = setTimeout(touchMap, 600); };
  });
}
function showInfo(kind, id) {
  const m = M.map, info = $('#minfo');
  let title = '', c = null, extra = '';
  if (kind === 'pin') { const p = m.pins.find(x => x.id === id); c = p && card(p.card); title = c ? c.title : ''; }
  if (kind === 'zone') { const z = m.zones.find(x => x.id === id); if (!z) return; c = z.card && card(z.card); title = z.name || (c ? c.title : 'Unnamed zone'); }
  if (kind === 'path') { const p = m.paths.find(x => x.id === id); if (!p) return; title = p.name || (PATH_STYLES[p.style] || PATH_STYLES.road).label; extra = 'No card linked'; }
  if (!title) return hideInfo();
  const t = c && typeOf(c);
  info.innerHTML = `${t ? `<span class="badge" style="color:${t.color};border-color:${t.color}">${t.icon} ${t.label}</span>` : ''}<h4>${esc(title)}</h4>
    <p>${c ? esc(excerpt(c, 200)) || '<i>Nothing written yet.</i>' : `<i>${extra || 'No card linked yet. Edit the map to link one.'}</i>`}</p>
    ${c ? `<div class="row"><button class="btn small solid" data-id="${esc(c.id)}">Open</button></div>` : ''}`;
  info.classList.remove('hidden');
}
function deleteSel() {
  const m = M.map, s = M.sel; if (!s) return;
  snapUndo();
  if (s.t === 'zone') { m.zones = m.zones.filter(z => z.id !== s.id); gcPoints(); }
  if (s.t === 'path') m.paths = m.paths.filter(p => p.id !== s.id);
  if (s.t === 'label') m.labels = m.labels.filter(l => l.id !== s.id);
  if (s.t === 'pin') m.pins = m.pins.filter(p => p.id !== s.id);
  if (s.t === 'pt') { m.zones.forEach(z => { z.pts = z.pts.filter(id => id !== s.id); }); m.zones = m.zones.filter(z => z.pts.length >= 3); gcPoints(); }
  touchMap(); select(null);
}

/* modes */
function enterEdit(tool) { M.edit = newEditState(tool); M.sel = null; hideInfo(); redraw(); fitMap(); }
function exitEdit(quiet) {
  if (!M) return;
  commitLayers(); M.edit = null; M.draft = null; M.sel = null; M.hover = null;
  if (!quiet) { hideInfo(); redraw(); }
}
function setTool(t) {
  if (M.edit.tool === 'paint' && t !== 'paint') commitPaint();
  if (M.edit.tool === 'terrain' && t !== 'terrain') commitHeight();
  if (M.draft && t !== M.draft.kind) M.draft = null;
  M.edit.tool = t; M.sel = null; hideInfo(); redraw();
}
function mapAct(a, el) {
  const v = el.dataset.v, it = M && selected();
  switch (a) {
    case 'new': return newMap();
    case 'fit': return fitMap();
    case 'edit': return enterEdit();
    case 'done': return exitEdit();
    case 'undo': return undo();
    case 'tool': return setTool(v);
    case 'paint': M.edit.paint = v; return drawTools();
    case 'brush': M.edit.brush = v; return drawTools();
    case 'sculpt': M.edit.sculpt = v; return drawTools();
    case 'exporth': return exportHeight();
    case '3d': return open3D();
    case 'close3d': return close3D();
    case 'water3d': ui.water3d = ui.water3d === false; saveJSON(UI_KEY, ui); el.classList.toggle('on', ui.water3d); return V3 && V3.draw();
    case 'finish': return finishDraft();
    case 'cancel': M.draft = null; M.hover = null; return redraw();
    case 'del': return deleteSel();
    case 'zcolor':
      if (M.edit) M.edit.zoneColor = v;
      if (M.sel && M.sel.t === 'zone') { snapUndo(); it.color = v; touchMap(); return select(M.sel); }
      return drawTools();
    case 'pstyle':
      if (M.edit) M.edit.pathStyle = v;
      if (M.sel && M.sel.t === 'path') { snapUndo(); it.style = v; touchMap(); return select(M.sel); }
      return drawTools();
    case 'lsize': snapUndo(); it.size = Math.round(+v * mapScale(M.map)); touchMap(); return select(M.sel);
    case 'lcolor': snapUndo(); it.color = v; touchMap(); return select(M.sel);
    case 'lelev': snapUndo(); it.elev = !it.elev; touchMap(); return select(M.sel);
    case 'style': {
      const st = mapStyle(M.map); st[v] = !st[v]; M.map.style = st; touchMap();
      drawShade(); drawDeco(); drawTools();
      if (V3) { V3.buildMesh(); V3.retex(); el.classList.toggle('on', st[v]); }
      return;
    }
    case 'link': return pickCard({ title: 'Link this zone to…', onPick: id => { it.card = id; if (!it.name) it.name = card(id).title; touchMap(); select(M.sel); } });
    case 'unlink': it.card = null; touchMap(); return select(M.sel);
    case 'menu': {
      const m = M.map;
      const choice = prompt(`Rename “${m.name}”, or type DELETE to remove this map.`, m.name);
      if (choice === null) return;
      if (choice.trim() === 'DELETE') {
        W.deleted[m.id] = Date.now(); W.maps = W.maps.filter(x => x.id !== m.id);
        meta.mediaGone = [...(meta.mediaGone || []), ...[m.paint, m.height].filter(Boolean)];
        ui.mapId = null; M = null; changed(); return go('#/map');
      }
      if (choice.trim()) { m.name = choice.trim(); touchMap(); drawTools(); }
      return;
    }
  }
}

/* pointer input: one finger uses the tool (or pans in view mode), two fingers pan and zoom */
function bindMap() {
  const st = $('#mstage'), pts = new Map(); let g = null;
  const local = e => { const r = st.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const toMap = p => ({ x: (p.x - M.view.x) / M.view.k, y: (p.y - M.view.y) / M.view.k });
  const attr = (t, sel, k) => { const el = t.closest(sel); return el ? el.getAttribute(k) : null; };
  st.addEventListener('pointerdown', e => {
    if (e.target.closest('.toolbar,.info') || !M.view) return;
    st.setPointerCapture(e.pointerId); pts.set(e.pointerId, local(e));
    if (pts.size === 2) {
      if (g && g.kind === 'paint') cancelStroke(g);
      if (g && g.kind === 'terrain') cancelSculpt(g);
      const [a, b] = [...pts.values()];
      g = { kind: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y), v0: { ...M.view }, m: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 } };
      return;
    }
    if (pts.size > 2) return;
    const p = local(e), q = toMap(p), t = e.target, tool = M.edit && M.edit.tool;
    const hit = { pt: attr(t, '[data-pt]', 'data-pt'), pp: attr(t, '[data-pp]', 'data-pp'), label: attr(t, '[data-label]', 'data-label'),
      pin: attr(t, '[data-pinbtn]', 'data-pinbtn'), zone: attr(t, '[data-zone]', 'data-zone'), path: attr(t, '[data-path]', 'data-path') };
    g = { kind: 'tap', p0: p, q0: q, v0: { ...M.view }, hit, moved: false };
    if (tool === 'paint') { g.kind = 'paint'; startStroke(g, q); }
    else if (tool === 'terrain') { g.kind = 'terrain'; startSculpt(g, q); }
    else if (tool === 'select' && (hit.pt || hit.pp !== null || hit.label || hit.pin)) { g.kind = 'drag'; g.before = vecState(); }
  });
  st.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) {
      if (M && M.draft && e.pointerType === 'mouse' && M.view) { M.hover = toMap(local(e)); drawVec(); }
      return;
    }
    pts.set(e.pointerId, local(e));
    if (!g) return;
    const p = local(e), q = toMap(p);
    if (g.kind === 'pinch') {
      if (pts.size < 2) return;
      const [a, b] = [...pts.values()], k = Math.max(.05, Math.min(10, g.v0.k * Math.hypot(a.x - b.x, a.y - b.y) / g.d0));
      M.view = { k, x: g.m.x - (g.m.x - g.v0.x) * k / g.v0.k, y: g.m.y - (g.m.y - g.v0.y) * k / g.v0.k }; applyMap(); return;
    }
    if (g.kind === 'paint') return strokeTo(g, q);
    if (g.kind === 'terrain') return sculptTo(g, q);
    if (Math.hypot(p.x - g.p0.x, p.y - g.p0.y) > 5) g.moved = true;
    if (!g.moved) return;
    if (g.kind === 'drag') {
      const m = M.map, h = g.hit, x = Math.round(q.x), y = Math.round(q.y);
      if (h.pt) m.points[h.pt] = { x, y };
      else if (h.pp !== null) { const path = m.paths.find(pa => pa.id === M.sel.id); path.pts[+h.pp] = [x, y]; }
      else if (h.label) { const l = m.labels.find(l => l.id === h.label); l.x = x; l.y = y; }
      else if (h.pin) { const pin = m.pins.find(pi => pi.id === h.pin); pin.x = +(q.x / m.w).toFixed(4); pin.y = +(q.y / m.h).toFixed(4); return drawPins(); }
      return drawVec();
    }
    M.view.x = g.v0.x + p.x - g.p0.x; M.view.y = g.v0.y + p.y - g.p0.y; applyMap();
  });
  const end = e => {
    pts.delete(e.pointerId);
    const d = g; if (!d) return;
    if (d.kind === 'pinch') { if (!pts.size) g = null; return; }
    g = null;
    if (d.kind === 'paint') return endStroke(d);
    if (d.kind === 'terrain') return endSculpt(d);
    if (d.kind === 'drag') {
      if (d.moved) { pushUndo({ v: d.before }); touchMap(); drawTools(); return; }
      const h = d.hit;
      return select(h.pin ? { t: 'pin', id: h.pin } : h.label ? { t: 'label', id: h.label } : h.pt ? { t: 'pt', id: h.pt } : M.sel);
    }
    if (!d.moved) tap(d);
  };
  st.addEventListener('pointerup', end); st.addEventListener('pointercancel', end);
  st.addEventListener('wheel', e => {
    if (!M.view) return; e.preventDefault();
    const p = local(e), v = M.view, k = Math.max(.05, Math.min(10, v.k * Math.exp(-e.deltaY * .0015)));
    M.view = { k, x: p.x - (p.x - v.x) * k / v.k, y: p.y - (p.y - v.y) * k / v.k }; applyMap();
  }, { passive: false });
}
function tap(d) {
  const h = d.hit, q = d.q0;
  if (!M.edit) {
    if (h.pin) return showInfo('pin', h.pin);
    if (h.zone) return showInfo('zone', h.zone);
    if (h.path) return showInfo('path', h.path);
    return hideInfo();
  }
  switch (M.edit.tool) {
    case 'select': return select(h.zone ? { t: 'zone', id: h.zone } : h.path ? { t: 'path', id: h.path } : null);
    case 'zone': return addZonePoint(q);
    case 'path': return addPathPoint(q);
    case 'label': return addLabel(q);
    case 'pin': return addPin(q);
  }
}
document.addEventListener('keydown', e => {
  if (!mapEditing() || e.target.closest('input,textarea,select')) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); return undo(); }
  if ((e.key === 'Delete' || e.key === 'Backspace') && M.sel) { e.preventDefault(); return deleteSel(); }
  if (e.key === 'Enter' && M.draft) return finishDraft();
  if (e.key === 'Escape') { if (M.draft) { M.draft = null; M.hover = null; return redraw(); } return select(null); }
});

/* new maps */
function newMap() {
  const box = modal(`<h2>New map</h2><p>Paint a world from scratch, or upload map art you drew.</p>
    <input class="inp" id="nmName" placeholder="Map name" style="width:100%;margin-bottom:10px">
    <div class="typegrid">${Object.entries(BGS).map(([k, c]) => `<button data-bg="${k}"><span class="sw" style="background:${c};width:18px;height:18px"></span>Blank · ${k}</button>`).join('')}
      <button data-up="1">⤒ Upload an image</button></div>
    <div class="row"><button class="btn" data-close>Cancel</button></div>`);
  box.querySelector('.typegrid').onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    const name = box.querySelector('#nmName').value.trim() || 'Map';
    let m;
    if (b.dataset.bg) {
      box.remove();
      m = { id: uid('map'), name, w: 2000, h: 1400, bg: BGS[b.dataset.bg] };
      pendingTool = 'paint';
    } else {
      const f = await chooseFile('image/*'); if (!f) return;
      box.remove();
      try {
        toast('Resizing…');
        const img = await shrinkImage(f, 2400);
        m = { id: uid('map'), name, img: await storeMedia(img.data), w: img.w, h: img.h };
      } catch (err) { return toast(err.message, 4000); }
    }
    W.maps.push(normalizeMap(Object.assign(m, { updated: Date.now() }))); changed();
    go('#/map/' + encodeURIComponent(m.id));
  };
  setTimeout(() => box.querySelector('#nmName').focus(), 30);
}
function normalizeMap(m) {
  m.pins = m.pins || []; m.points = m.points || {}; m.zones = m.zones || []; m.paths = m.paths || []; m.labels = m.labels || [];
  return m;
}

/* ---------- terrain: height map, hill shading, 3D view, export ---------- */
// Heights live at 1/4 of map resolution as floats from H_MIN to H_MAX; 0 is sea level, so digging below 0 makes water.
// Stored as gzipped little-endian Uint16 (media id "mh…", synced as data/media/<id>.bin).
const H_SCALE = 4, H_MIN = -0.3, H_MAX = 1;
const SCULPT = { raise: 'Raise', lower: 'Lower', smooth: 'Smooth', flatten: 'Flatten' };
const hDims = m => ({ hw: m.hw || Math.max(2, Math.round(m.w / H_SCALE)), hh: m.hh || Math.max(2, Math.round(m.h / H_SCALE)) });
function ensureH() {
  if (!M.H) { const d = hDims(M.map); M.hw = d.hw; M.hh = d.hh; M.H = new Float32Array(d.hw * d.hh); }
  return M.H;
}
async function streamBytes(bytes, stream) { return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer()); }
async function encodeHeight(H) {
  const u = new Uint8Array(H.length * 2);

/* ---------- search ---------- */

  const el = $('#bgList'); if (!el || !W) return;
  el.innerHTML = `<div class="bgc${W.theme.bg ? '' : ' on'}" data-bgset="" style="background:radial-gradient(60% 60% at 30% 30%,rgba(91,224,200,.5),transparent),radial-gradient(60% 60% at 75% 40%,rgba(124,108,255,.5),transparent),#0e1512"><span>Aurora (built in)</span></div>` +
    W.backgrounds.map(b => `<div class="bgc${W.theme.bg === b.id ? ' on' : ''}" data-bgset="${esc(b.id)}" data-bgimg="${esc(b.img)}"><span>${esc(b.name)}</span><button class="x" data-bgdel="${esc(b.id)}" title="Delete">×</button></div>`).join('');
  el.querySelectorAll('[data-bgimg]').forEach(async n => { const d = await getMedia(n.dataset.bgimg); if (d) n.style.backgroundImage = `url("${d}")`; });
}
async function addBackground() {
  const f = await chooseFile('image/*'); if (!f) return;
  const name = prompt('Name this background (e.g. City at night)', f.name.replace(/\.[^.]+$/, '')); if (name === null) return;
  try {
    const img = await shrinkImage(f, 2000);
    const b = { id: uid('bg'), name: name.trim() || 'Background', img: await storeMedia(img.data), updated: Date.now() };
    W.backgrounds.push(b);
    if (!W.theme.bg) W.theme.bg = b.id;
    changed(); drawBgList(); bgShown = undefined; applyBg(); toast('Background added');
  } catch (e) { toast(e.message, 4000); }
}
function deleteBackground(id) {
  const b = W.backgrounds.find(x => x.id === id); if (!b || !confirm(`Delete the background “${b.name}”?`)) return;
  W.deleted[id] = Date.now(); W.backgrounds = W.backgrounds.filter(x => x.id !== id);
  if (W.theme.bg === id) W.theme.bg = null;
  W.cards.forEach(c => { if (c.bg === id) { c.bg = null; touch(c); } });
  changed(); drawBgList(); applyBg();
}

/* ---------- settings, import, export ---------- */
function openSettings() {
  const m = modal(`<h2>Sync &amp; backup</h2>
    <p>Your Codex is saved on this device. To share it between your phone and computer, it syncs to <b>${esc(gh.owner)}/${esc(gh.repo)}</b> (private), file <code>${WORLD_PATH}</code>.</p>
    <p class="hint">Use a fine-grained GitHub token with <b>Contents: Read and write</b> on the <b>codex</b> repo. It stays in this browser only.</p>
    <form class="form" id="ghf">
      <label>GitHub token<input class="inp" name="token" type="password" value="${esc(gh.token)}" placeholder="github_pat_…" autocomplete="off"></label>
      <div class="two"><label>Repo (owner/name)<input class="inp" name="repo" value="${esc(gh.owner + '/' + gh.repo)}"></label>
      <label>Branch<input class="inp" name="branch" value="${esc(gh.branch)}"></label></div>
      <div class="row"><button class="btn solid" type="submit">Save &amp; sync</button>${gh.token ? '<button class="btn" type="button" data-act="disconnect">Forget token</button>' : ''}</div>
    </form>
    <p class="hint" style="margin-top:10px">${esc(syncMsg || '')}${meta.lastSync ? ' · last sync ' + new Date(meta.lastSync).toLocaleString() : ''}</p>
    <h2 style="font-size:22px;margin-top:18px">Backgrounds</h2>
    <p class="hint">Tap one to make it the default. A card can pick its own in Edit, and cards inside it follow. Images stay in the private repo.</p>
    <div class="bgs" id="bgList"></div>
    <div class="row"><button class="btn" data-act="bg-add">Add background</button></div>
    <h2 style="font-size:22px;margin-top:18px">Backup</h2>
    <div class="row"><button class="btn" data-act="export">Download a backup</button><button class="btn" data-act="import">Open a backup</button></div>
    <div class="row"><button class="btn" data-close>Close</button></div>`);
  m.querySelector('#ghf').onsubmit = async e => {
    e.preventDefault(); const el = e.target.elements; const [owner, repo] = el.repo.value.trim().split('/');
    gh = { token: el.token.value.trim(), owner: owner || DEFAULT_GH.owner, repo: repo || DEFAULT_GH.repo, branch: el.branch.value.trim() || 'main' };
    saveJSON(GH_KEY, gh); m.remove(); meta.baseSha = null;
    await sync({ loud: true, render: true });
  };
  drawBgList();
  m.addEventListener('click', e => {
    if (e.target.dataset.act === 'disconnect') { gh.token = ''; saveJSON(GH_KEY, gh); m.remove(); setSync('local'); toast('Token removed from this browser'); }
  });
}
async function exportWorld() {
  const bundle = { ...W, media: {} };
  for (const id of mediaIds()) { const d = await getMedia(id); if (d) bundle.media[id] = d; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(bundle)], { type: 'application/json' }));
  a.download = `codex2_backup_${new Date().toISOString().slice(0, 10)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function importWorld() {
  const f = await chooseFile('application/json,.json'); if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch (e) { return toast('That file isn’t valid JSON.', 4000); }
  if (data.format !== 'codex2' || !Array.isArray(data.cards)) return toast('That file isn’t a Codex 2.0 world.', 4000);
  for (const [id, d] of Object.entries(data.media || {})) { media[id] = d; await idbPut('media', id, d); }
  delete data.media;
  const incoming = normalize(data);
  if (W && W.cards.length && !confirm(`Merge ${incoming.cards.length} cards from this file into your Codex? Where both have the same card, the newer edit wins.`)) return;
  W = W ? normalize(merge(W, incoming)) : incoming;
  document.querySelector('.modal')?.remove();
  changed(); toast('Imported ' + incoming.cards.length + ' cards'); go('#/');
}

/* ---------- global clicks ---------- */
document.addEventListener('click', async e => {
  const t = e.target;
  const cb = t.closest('.body input[type=checkbox][data-line]');
  if (cb) {
    const c = card(route().id); if (!c) return;
    const lines = c.body.split('\n'), i = +cb.dataset.line;
    lines[i] = lines[i].replace(/\[( |x|X)\]/, cb.checked ? '[x]' : '[ ]');
    c.body = lines.join('\n'); touch(c); changed();
    cb.closest('li').classList.toggle('done', cb.checked);
    return;
  }
  const idEl = t.closest('[data-id]:not(.gn)');
  if (idEl && !t.closest('.results') && !t.closest('svg')) { e.preventDefault(); return openCard(idEl.dataset.id); }
  if (t.closest('.results [data-id]')) { return openCard(t.closest('[data-id]').dataset.id); }
  const nw = t.closest('[data-new]');
  if (nw) return pickType('New card: ' + nw.dataset.new, ty => newCard(ty, nw.dataset.new));
  const open = t.closest('[data-open]');
  if (open) return openCard(open.dataset.open);
  const ft = t.closest('[data-ftype]');
  if (ft) { ui.fType = ft.dataset.ftype; $('#fType').value = ui.fType; saveJSON(UI_KEY, ui); renderList(); document.body.classList.add('side-open'); return; }
  const stb = t.closest('[data-status]');
  if (stb) { const c = card(route().id); setStatus(c, stb.dataset.status); toast(STATUSES[stb.dataset.status].label + ': ' + c.title); const n = nextToReview(c.id); return n ? openCard(n.id) : render(); }
  const bd = t.closest('[data-bgdel]');
  if (bd) return deleteBackground(bd.dataset.bgdel);
  const bs = t.closest('[data-bgset]');
  if (bs) { W.theme.bg = bs.dataset.bgset || null; changed(); drawBgList(); return applyBg(); }
  const dr = t.closest('[data-delrel]');
  if (dr) { W.deleted[dr.dataset.delrel] = Date.now(); W.relations = W.relations.filter(r => r.id !== dr.dataset.delrel); changed(); return render(); }
  const act = t.closest('[data-act]'); if (!act || act.tagName === 'SELECT') return;
  if (act.dataset.act.startsWith('m-')) return mapAct(act.dataset.act.slice(2), act);
  const c = W && route().id ? card(route().id) : null;
  switch (act.dataset.act) {
    case 'settings': return openSettings();
    case 'bg-add': return addBackground();
    case 'import': return importWorld();
    case 'export': return exportWorld();
    case 'start-empty': W = blankWorld(); changed(); return render();
    case 'edit': editing = { id: c.id, dirty: false }; return render();
    case 'cancel-edit': if (editing && editing.dirty && !confirm('Throw away your changes?')) return; editing = null; return render();
    case 'delete': return deleteCard(c);
    case 'add-field': $('#frows').insertAdjacentHTML('beforeend', frow('', '')); editing.dirty = true; return;
    case 'del-field': act.closest('.frow').remove(); editing.dirty = true; return;
    case 'card-img': {
      const f = await chooseFile('image/*'); if (!f) return;
      try { const img = await shrinkImage(f, 1400); saveEditDraft(c); c.img = await storeMedia(img.data); touch(c); changed(); render(); } catch (err) { toast(err.message, 4000); }
      return;
    }
    case 'card-img-del': saveEditDraft(c); c.img = null; touch(c); changed(); return render();
    case 'add-rel': return pickCard({ title: 'Connect ' + c.title + ' to…', label: true, exclude: c.id, onPick: (id, label) => addRel(c.id, id, label) });
    case 'add-rel-graph': { const s = G.sel; return pickCard({ title: 'Connect ' + card(s).title + ' to…', label: true, exclude: s, onPick: (id, label) => { G.keep = true; addRel(s, id, label); } }); }
    case 'unselect': return selectNode(null);
    case 'graph-here': return go('#/graph/' + encodeURIComponent(c.id));
    case 'review-next': { const n = nextToReview(c && c.id); return n ? openCard(n.id) : toast('Nothing left to review'); }
    case 'tog-mentions': ui.showMentions = !ui.showMentions; saveJSON(UI_KEY, ui); G.keep = true; return render();
    case 'tog-v35': ui.showV35 = !ui.showV35; saveJSON(UI_KEY, ui); G.keep = false; return render();
    case 'relayout': layoutGraph(G.nodes, G.edges, true); changed(); G.keep = false; return render();
    case 'fit': return fitGraph();
    case 'new-event': return newCard('event');
  }
});
// Keep unsaved form text when an image action re-renders the edit form.
function saveEditDraft(c) {
  const f = $('#ed'); if (!f) return;
  const el = f.elements;
  c.title = el.title.value.trim() || c.title; c.body = el.body.value; c.aliases = el.aliases.value.split(',').map(x => x.trim()).filter(Boolean);
}
function addRel(a, b, label) {
  W.relations.push({ id: uid('r'), a, b, label: label || '', updated: Date.now() });
  changed(); toast('Connected'); render();
}
document.addEventListener('change', e => {
  if (e.target.id === 'maxElev' && M) { M.map.maxElev = Math.max(1, +e.target.value || 1000); touchMap(); drawVec(); return; }
  if (e.target.matches('select[data-act="set-status"]')) { const c = card(route().id); setStatus(c, e.target.value); render(); }
});

/* ---------- boot ---------- */
$('#menuBtn').onclick = () => document.body.classList.toggle('side-open');
$('#scrim').onclick = () => document.body.classList.remove('side-open');
$('#newBtn').onclick = () => { if (!W) return; document.body.classList.remove('side-open'); pickType('New card', t => newCard(t)); };
$('#syncBtn').onclick = openSettings;
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) return;
  if (mapEditing()) commitLayers();
  if (meta.dirty && gh.token) sync();
});
window.addEventListener('beforeunload', e => { if (editing && editing.dirty) { e.preventDefault(); e.returnValue = ''; } });

(async function boot() {
  initFilters(); bindSearch();
  try {
    W = await idbGet('kv', 'world'); const m = await idbGet('kv', 'meta'); if (m) meta = Object.assign(meta, m);
  } catch (e) {
    try { W = JSON.parse(localStorage.getItem('codex2_world_fallback') || 'null'); } catch (e2) {}
  }
  W = W ? normalize(W) : null;
  setSync(gh.token ? (meta.dirty ? 'dirty' : 'ok') : 'local');
  render();
  if (gh.token) sync({ render: !W });
})();
</script>
</body>
